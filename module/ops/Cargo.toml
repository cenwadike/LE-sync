[package]
name = "eth-attest-ops"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Submitter, source and chain client of the eth_attest module, and the eth_attest_ops CLI"

# Its own workspace: the Logos wrapper (../rust-lib) and the scripts build it by path.
[workspace]

[lib]
name = "eth_attest_ops"
path = "src/lib.rs"

[[bin]]
name = "eth_attest_ops"
path = "src/bin/eth_attest_ops.rs"

[dependencies]
le-sync-core = { path = "../../core" }
le-sync-wire = { path = "../../wire", features = ["bls-blst", "serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
hex = "0.4.3"
sha2 = "0.10.9"
ureq = "2"
tokio = { version = "1.28.2", features = ["rt-multi-thread", "time"] }
risc0-zkvm = { version = "=3.0.5", features = ["std"] }

# The LEZ pins of lez/Cargo.toml, written the same way so Cargo resolves one lee_core.
nssa = { package = "lee", git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0" }
nssa_core = { package = "lee_core", git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0" }
clock_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0" }
wallet = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0" }
common = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0" }
# CONFIRM: `lez/src/generated/*_client.rs` imports `sequencer_service_rpc`; copy its dependency
# line from whichever manifest in lez/ lists it.
sequencer_service_rpc = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0" }
spel-framework-core = { git = "https://github.com/logos-co/spel.git", rev = "4964304095875774a071c300a9ebf9feebf18f73" }
