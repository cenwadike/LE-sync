[package]
name = "guest"
version = "0.1.0"
edition = "2021"

# Own workspace: this crate is built for riscv32im-risc0-zkvm-elf, not by the root workspace.
[workspace]

[dependencies]
risc0-zkvm = { version = "=3.0.5", default-features = false, features = [
    "std",
] }
# Pick ONE BLS backend: "bls-zk" (risc0 bls12_381) or "bls-blst" (risc0-patched blst).
# "cycle-trace": per-phase cycle log (remove for a clean measurement of the real program).
# "unchecked-pubkeys": skip per-key subgroup check (add only when evaluating that trade-off).
le-sync-wire = { path = "../wire", features = ["bls-zk", "cycle-trace"] }
# Force sha2 to 0.10.8 so the [patch] below applies (the patch is for that exact version).
sha2 = { version = "=0.10.8", default-features = false }

# Accelerated SHA-256 (tag from the risc0 acceleration docs page; sha2 must resolve to 0.10.8).
[patch.crates-io]
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.8-risczero.0" }
