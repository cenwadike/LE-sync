[package]
name = "le-sync-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "no_std Ethereum light-client primitives (SSZ Merkle branches, LC gindices by fork) for LE-Sync / Logos LEZ"

[dependencies]
sha2 = { version = "0.10", default-features = false }
# Keccak-256 for the execution-layer trie. no_std. See src/keccak.rs: one function, one place to swap.
tiny-keccak = { version = "2.0.2", default-features = false, features = [
    "keccak",
] }
