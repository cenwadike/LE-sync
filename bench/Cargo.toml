[package]
name = "le-sync-bench"
version = "0.1.0"
edition = "2021"
publish = false
description = "Sprint 6 M1 cost gate: executes the three staged update steps in the RISC Zero executor (execute-only) and prints a cycles table"

# Own workspace, like ../guest and ../guest-stage. It is listed in the root `exclude`.
# Reason: `bls-blst` pulls in the risc0 fork of `blst` (`links = "blst"`), and
# `le-sync-vectors` pulls in crates.io `blst` by default; one workspace build that enables
# both fails. Build and run this crate through `--manifest-path bench/Cargo.toml`.
[workspace]

[dependencies]
le-sync-core = { path = "../core" }
# `bls-blst` gives the native reference run `Impl: StagedBls`. Default features keep serde on.
le-sync-wire = { path = "../wire", features = ["bls-blst"] }
# Seeded committees, real BLS signer and BeaconState-shaped trees for the synthetic fixture.
le-sync-testkit = { path = "../testkit" }
# Same pin as ../host.
risc0-zkvm = "=3.0.5"
# The host side of ../guest-stage/src/lez_io.rs (included by path) derives serde.
serde = { version = "1", features = ["derive"] }
# `--agg` builds the committee tree and the multiproof on the host.
sha2 = "0.10"
# Same git and tag as the optional `blst` in ../wire (one package, `links = "blst"`): the host
# makes the uncompressed key points the guest checks.
blst = { git = "https://github.com/risc0/blst", tag = "blst/v0.3.14-risczero.0" }

[build-dependencies]
risc0-build = "=3.0.5"

# risc0-build compiles ../guest-stage (package name `guest-stage`), which has five binaries:
# guest-stage, lez-stage, lez-rooted, keys and agg. The generated constants are GUEST_STAGE_*,
# LEZ_STAGE_*, LEZ_ROOTED_*, KEYS_* and AGG_* (each ELF and ID); see the generated methods.rs.
[package.metadata.risc0]
methods = ["../guest-stage"]
