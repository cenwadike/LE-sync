[package]
name = "guest-stage"
version = "0.1.0"
edition = "2021"

# Own workspace: built for riscv32im-risc0-zkvm-elf by risc0-build (see bench/build.rs), not by
# the root workspace. Same pins as ../guest.
[workspace]

# Three programs in one guest package (risc0-build embeds every binary of a guest package; the
# generated constants are GUEST_STAGE_*, LEZ_STAGE_* and KEYS_*, confirm in methods.rs):
#   guest-stage (src/main.rs)  the staged update with simple inputs and outputs
#   lez-stage                  the same steps with the LEZ input and output layout (lez_io.rs)
#   keys                       micro-benchmark of committee key decoding
[[bin]]
name = "lez-stage"
path = "src/lez_stage.rs"

[[bin]]
name = "keys"
path = "src/keys.rs"

[dependencies]
risc0-zkvm = { version = "=3.0.5", default-features = false, features = [
    "std",
] }
# Staging needs raw Miller access, so only the blst backend works here (bls-zk hides it).
# "cycle-trace": per-phase cycle log inside each stage (remove for a clean total).
# "unchecked-pubkeys": skip the per-key check (only when evaluating that trade-off).
le-sync-wire = { path = "../wire", features = ["bls-blst", "cycle-trace"] }
# Force sha2 to 0.10.8 so the [patch] below applies (the patch is for that exact version).
sha2 = { version = "=0.10.8", default-features = false }
# lez_io.rs derives serde for the platform's account and output shapes.
serde = { version = "1", features = ["derive"] }
# Raw blst calls for `keys`: the same git and tag as the optional `blst` in ../wire, so it is
# the same package (`links = "blst"`).
blst = { git = "https://github.com/risc0/blst", tag = "blst/v0.3.14-risczero.0" }

# Accelerated SHA-256 (same tag as ../guest).
[patch.crates-io]
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.8-risczero.0" }
