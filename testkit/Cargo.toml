[package]
name = "le-sync-testkit"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Test-only: seeded BLS keys, committees, signers and Merkle/BeaconState fixtures. Never ship, never link into the guest."

[dependencies]
le-sync-core = { path = "../core" }
sha2 = { version = "0.10", default-features = false }
# Same risc0 fork + tag as `wire`'s optional dependency, so the graph has one copy.
bls12_381 = { git = "https://github.com/risc0/zkcrypto-bls12_381", tag = "bls12_381/v0.8.0-risczero.1", default-features = false, features = [
    "groups",
    "pairings",
    "alloc",
    "experimental",
] }
# Needed by hash-to-curve's ExpandMsgXmd (digest 0.9), as in wire.
sha2_09 = { package = "sha2", version = "0.9.9", default-features = false }
