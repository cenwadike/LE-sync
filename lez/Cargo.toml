[package]
name = "lez"
version = "0.1.0"
edition = "2024"
license = { workspace = true }

[workspace.package]
license = "MIT or Apache-2.0"

[workspace]
resolver = "3"
# methods/guest is its own workspace (see methods/guest/Cargo.toml): it needs the RISC Zero
# sha2 patch and the blst fork, which must not apply to the host crates.
exclude = ["methods/guest", "executor-tests"]
members = [".", "methods", "crates/lez-client-gen"]

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.dependencies]
# Match SPEL's LEZ tag and package aliases so Cargo resolves one copy of each LEZ crate.
nssa = { package = "lee", git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0" }
nssa_core = { package = "lee_core", git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0" }
wallet = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0" }
common = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0" }

risc0-zkvm = { version = "3.0.5", features = ["std"] }
risc0-build = "3.0.5"

spel-framework = { git = "https://github.com/logos-co/spel.git", rev = "4964304095875774a071c300a9ebf9feebf18f73" }
spel-framework-core = { git = "https://github.com/logos-co/spel.git", rev = "4964304095875774a071c300a9ebf9feebf18f73" }
spel-client-gen = { git = "https://github.com/logos-co/spel.git", rev = "4964304095875774a071c300a9ebf9feebf18f73" }

hex = "0.4.3"
bytemuck = "1.24.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
clap = { version = "4.5.42", features = ["derive", "env"] }
tokio = { version = "1.28.2", features = [
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "fs",
] }
borsh = { version = "1.5", features = ["derive"] }

[dependencies]
nssa.workspace = true
nssa_core.workspace = true
wallet.workspace = true
common.workspace = true
spel-framework.workspace = true
spel-framework-core.workspace = true
execute_attestation_deployment_methods = { path = "methods" }

serde.workspace = true
hex.workspace = true
clap.workspace = true
tokio = { workspace = true, features = ["macros"] }
