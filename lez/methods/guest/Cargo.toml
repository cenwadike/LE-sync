[package]
name = "execute_attestation_deployment_programs"
version = "0.1.0"
edition = "2024"
license = "MIT or Apache-2.0"

# Own workspace, as in `guest-stage`: this package is built for riscv32im-risc0-zkvm-elf by
# risc0-build (methods/build.rs), and it needs the RISC Zero sha2 fork and the blst fork below,
# which must not apply to the host crates of the root workspace (see `exclude` there).
[workspace]

[dependencies]
nssa_core = { package = "lee_core", git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0" }
clock_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0" }
spel-framework = { git = "https://github.com/logos-co/spel.git", rev = "4964304095875774a071c300a9ebf9feebf18f73" }
spel-framework-core = { git = "https://github.com/logos-co/spel.git", rev = "4964304095875774a071c300a9ebf9feebf18f73" }
risc0-zkvm = { version = "3.0.5", default-features = false, features = ["std"] }
serde = { version = "1.0.228", features = ["derive"] }

# The light client. `bls-blst` is the staged backend (raw Miller access); the same crates and
# features the measured guests (`guest-stage`) use.
le-sync-core = { path = "../../../core" }
le-sync-wire = { path = "../../../wire", features = ["bls-blst"] }
# Pinned so that the [patch] below applies (the patch is for exactly this version).
sha2 = { version = "=0.10.8", default-features = false }

# Accelerated SHA-256 (same tag as ../../../guest-stage).
[patch.crates-io]
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.8-risczero.0" }

[[bin]]
name = "eth_attest"
path = "src/bin/eth_attest.rs"
test = false
