[scaffold]
version = "0.2.0"

[repos.lez]
source = "https://github.com/logos-blockchain/logos-execution-zone.git"
pin = "a58fbce2ff48c58b7bb5001b1a27e64b9596ee3a"

[repos.spel]
source = "https://github.com/logos-co/spel.git"
pin = "4964304095875774a071c300a9ebf9feebf18f73"

[repos.basecamp]
source = "https://github.com/logos-co/logos-basecamp.git"
pin = "bbe5da0e038ef19095690f4164a8ddaab0915821"
build = "nix-flake"
attr = "app"

[repos.lgpm]
source = "github:logos-co/logos-package-manager"
pin = "d3af2972f51d9c542537d80d60ad8d20282ddcd1"
build = "nix-flake"
attr = "cli"

[wallet]
home_dir = ".scaffold/wallet"

[framework]
kind = "lez-framework"
version = "0.1.0"

[framework.idl]
spec = "lssa-idl/0.1.0"
path = "idl"

[localnet]
port = 3040
risc0_dev_mode = true

[circuits]
version = "0.4.1"
