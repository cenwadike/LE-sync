[package]
name = "le-sync"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "std host: fetch beacon light-client data, run le-sync-core inside the RISC Zero guest, report cycles"

[lib]
name = "le_sync"
path = "src/lib.rs"

[[bin]]
name = "le-sync"
path = "src/main.rs"

[dependencies]
le-sync-core = { path = "../core" }
le-sync-wire = { path = "../wire" }
le-sync-testkit = { path = "../testkit" }
bincode = "1.3"
serde_json = "1"
hex = "0.4"
ureq = "2"
env_logger = "0.11"
# Keep identical to the LEZ pin.
risc0-zkvm = "=3.0.5"

[build-dependencies]
risc0-build = "=3.0.5"

[dev-dependencies]
sha2 = { version = "0.10", default-features = false }

# risc0-build compiles this crate (package name `guest` => GUEST_ELF / GUEST_ID).
[package.metadata.risc0]
methods = ["../guest"]
